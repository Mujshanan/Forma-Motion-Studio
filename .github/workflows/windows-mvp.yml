name: Windows MVP
on:
  pull_request:
    branches: [main, feat/vector-shape-tools]
  push:
    branches: [feat/vector-shape-tools]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Package portable Windows MVP
        run: npx --yes electron-builder@26.0.12 --win portable --x64 --publish never
      - name: Upload Windows MVP
        uses: actions/upload-artifact@v4
        with:
          name: Forma-Motion-Studio-Windows-MVP
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
